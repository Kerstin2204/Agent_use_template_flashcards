<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Vokabelpaar hinzufügen</h1>
    <form id="word-pair-form">
      <label for="english-word">Englisch</label>
      <input id="english-word" name="english" type="text" required>

      <label for="german-word">Deutsch</label>
      <input id="german-word" name="german" type="text" required>

      <button type="submit">OK</button>
      <p id="form-message" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
